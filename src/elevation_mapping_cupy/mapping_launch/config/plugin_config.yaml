# 1. 局部最低滤波
min_filter:                                   
  enable: True                                
  fill_nan: False                             
  is_height_layer: True                       
  layer_name: "min_filter"                    
  extra_params:                               
    dilation_size: 1                         
    iteration_n: 5                            # 建议从 30 改小为 5，大幅降低耗时

# 2. 平滑滤波
smooth_filter:
  enable: True
  fill_nan: False
  is_height_layer: True
  layer_name: "smooth"
  extra_params:
    input_layer_name: "min_filter"

# 3. 盲区修复 (暂时禁用以防拖垮 CPU 性能)
inpainting:
  enable: True
  fill_nan: False
  is_height_layer: True
  layer_name: "inpaint"
  extra_params:
    method: "telea"

# 4. 安全边界膨胀。traversability 和法向量是地图内建层，不是插件。
erosion:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "erosion"
  extra_params:
    input_layer_name: "traversability"
    dilation_size: 2                          # 膨胀核尺寸
    iteration_n: 3                            # 建议从 20 改小为 3~5
    reverse: True
