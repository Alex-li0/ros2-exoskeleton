# 1. 局部最低滤波
min_filter:                                   
  enable: True                                
  fill_nan: False                             
  is_height_layer: True                       
  layer_name: "min_filter"                    
  extra_params:                               
    dilation_size: 1                         
    iteration_n: 5                            # 建议从 30 改小为 5，大幅降低耗时

# 2. 平滑滤波
smooth_filter:
  enable: True
  fill_nan: False
  is_height_layer: True
  layer_name: "smooth"
  extra_params:
    input_layer_name: "min_filter"

# 3. 盲区修复 (暂时禁用以防拖垮 CPU 性能)
inpainting:
  enable: True
  fill_nan: False
  is_height_layer: True
  layer_name: "inpaint"
  extra_params:
    method: "telea"

# 4. 法向量计算 (必须在 traversability 之前)
normal_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "normal"
  extra_params:
    input_layer_name: "smooth"                # 用平滑后的地表算出的法线更干净
    radius: 0.1                               # 邻域半径 (米)

# 5. 可通行度初筛 (必须在 erosion 之前计算出 traversability)
traversability_filter:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "traversability"
  extra_params:
    input_layer_name: "smooth"
    critical_slope: 0.5                       # 极限坡度 (rad，约30度)
    critical_step: 0.15                       # 极限台阶 (m)

# 6. 安全边界膨胀 (输入依赖 traversability)
erosion:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "erosion"
  extra_params:
    input_layer_name: "traversability"
    dilation_size: 2                          # 膨胀核尺寸
    iteration_n: 3                            # 建议从 20 改小为 3~5
    reverse: True