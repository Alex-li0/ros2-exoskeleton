        w_offset: -0.4077
        w_x: [0.0000, -0.2472, 0.0823]
        w_y: [0.0000, 0.2690, 0.3158]

      left_ankle:
        num_harmonics: 4
        limit_min: -0.29
        limit_max: 0.29
