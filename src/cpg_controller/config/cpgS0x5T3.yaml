adaptive_cpg_node:
  ros__parameters:
    mu: 1.0
    omega: 5.024315
    gamma: 15.0
    eta_w: 0.00      # 纯离线回放，学习率设为0
    eta_omega: 0.00

    # === 启停状态机参数 ===
    ramp_time: 0.5              # 渐入/渐出时间 (秒)
    initial_perturbation: 0.1   # 启动时振子扰动量

    # === 踝关节开关 ===
    # true: 仿真时输出 CPG 踝关节角度 (可视化)
    # false: 实机时踝关节锁定 w_offset (被动关节不助力)
    publish_ankle: true

    joints:
      left_hip3:
        num_harmonics: 2
        limit_min: -0.2768
        limit_max: 0.3532
