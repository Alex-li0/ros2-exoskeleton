        w_y: [0.0000, 0.1076]

      left_knee:
        num_harmonics: 3
        limit_min: -1.14
        limit_max: 0.05
        w_offset: -0.3251
        w_x: [0.0000, -0.4062, -0.1563]
        w_y: [0.0000, 0.1519, 0.1420]

      left_ankle:
        num_harmonics: 4
        limit_min: -0.15
        limit_max: 0.15
        w_offset: 0.0028
        w_x: [0.0000, -0.0375, -0.0060, 0.0131]
        w_y: [0.0000, -0.0455, 0.0396, 0.0536]

      right_hip3:
        num_harmonics: 2
        limit_min: -0.2873
