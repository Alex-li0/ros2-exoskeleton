        w_y: [0.0000, 0.0888]

      left_knee:
        num_harmonics: 3
        limit_min: -1.11
        limit_max: 0.08
        w_offset: -0.3405
        w_x: [0.0000, -0.4018, -0.1074]
        w_y: [0.0000, 0.1724, 0.1626]

      left_ankle:
        num_harmonics: 4
        limit_min: -0.07
        limit_max: 0.13
        w_offset: 0.0137
        w_x: [0.0000, -0.0188, -0.0001, 0.0183]
        w_y: [0.0000, -0.0411, 0.0333, 0.0311]

      right_hip3:
