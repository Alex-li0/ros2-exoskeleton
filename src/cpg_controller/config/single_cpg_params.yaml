single_leg_cpg:
  ros__parameters:
    # ==========================================
    # 1. CPG 底层数学参数 (Heartbeat 主振荡器)
    # ==========================================
    mu: 1.0              # 极限环半径的平方 (决定振幅基准，通常保持 1.0)
    omega: 6.2831853     # 基础角频率 (2 * pi * 1Hz = 6.28)
    gamma: 10.0          # 收敛速度 (数字越大，回到极限环越快)

    # ==========================================
    # 2. 髋关节 (Hip) 映射参数
    # ==========================================
    w_hx: -0.2972            # cos(wt) 的权重
    w_hy: 0.2671            # sin(wt) 的权重
    h_offset: 0.1000        # 关节运动中点偏移

    # ==========================================
    # 3. 膝关节 (Knee) 映射参数 (包含双峰特征)
    # ==========================================
    w_kx1: 0.3339          # cos(wt) 的权重 (sin 滞后 90 度即为 -cos)
    w_ky1: 0.3715          # sin(wt) 的权重
    w_kx2: 0.1985          # cos(2wt) 的权重
    w_ky2: 0.0212          # sin(2wt) 的权重 (二倍角倍频，塑造双峰)
    k_offset: -0.5000       # 关节运动中点偏移

    # ==========================================
    # 4. 踝关节 (Ankle) 映射参数
    # ==========================================
    w_ax: -0.0080          # cos(wt) 的权重
    w_ay: 0.1496          # sin(wt) 的权重
    a_offset: -0.0500      # 关节运动中点偏移
