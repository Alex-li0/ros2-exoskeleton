adaptive_cpg_node:
  ros__parameters:
    mu: 1.0
    gamma: 15.0
    eta_w: 0.00      # 纯离线回放，学习率设为0
    eta_omega: 0.00

    # === 启停状态机参数 ===
    ramp_time: 0.5              # 渐入/渐出时间 (秒)
    initial_perturbation: 0.1   # 启动时振子扰动量

    # === 踝关节开关 ===
    # true: 仿真时输出 CPG 踝关节角度 (可视化)
    # false: 踝关节参考位置和速度均输出 0（被动关节）
    publish_ankle: true
    # 生产连续调制尚无标定数据，0.0 表示 CPG 不接受连续参数目标。
    # TODO(data_required): 获得地形转换数据后再配置正超时值并启用。
    parameter_target_timeout_s: 0.0
    modulation_transition_s: 0.5  # 连续参数目标及超时回退的平滑时间
    observe_measurements: false  # 仅缓存 /cpg/measured_joint_states，不开启学习
    measurement_timeout_s: 0.1

    # === Gait Library ===
    # default_gait: 启动时加载的 gait mode
    # 统一外部入口为 /cpg/gait_mode_cmd，由安全调度节点检查后转发。
    default_gait: flat_walk

    gait_modes: [flat_walk, slope_up]   # 可用 mode 列表

    gait_library:
      flat_walk:
        omega: 5.720866
        joints:
          left_hip3:
            num_harmonics: 3
            limit_min: -0.3032
            limit_max: 0.3168
            w_offset: 0.0000
            w_x: [0.0000, 0.2142, 0.0449]
            w_y: [0.0000, 0.1125, -0.0209]

          left_knee:
            num_harmonics: 3
            limit_min: -1.03
            limit_max: 0.08
            w_offset: -0.3536
            w_x: [0.0000, -0.3893, -0.0878]
            w_y: [0.0000, 0.1008, 0.1350]

          left_ankle:
            num_harmonics: 4
            limit_min: -0.05
            limit_max: 0.11
            w_offset: 0.0271
            w_x: [0.0000, -0.0181, -0.0075, 0.0141]
            w_y: [0.0000, -0.0120, 0.0319, 0.0210]

          right_hip3:
            num_harmonics: 3
            limit_min: -0.2943
            limit_max: 0.3057
            w_offset: 0.0000
            w_x: [0.0000, -0.2082, 0.0373]
            w_y: [0.0000, -0.1168, -0.0189]

          right_knee:
            num_harmonics: 3
            limit_min: -0.59
            limit_max: 0.1
            w_offset: -0.1481
            w_x: [0.0000, 0.2194, -0.0482]
            w_y: [0.0000, -0.0826, 0.1020]

          right_ankle:
            num_harmonics: 4
            limit_min: 0.04
            limit_max: 0.17
            w_offset: 0.1121
            w_x: [0.0000, 0.0185, 0.0143, -0.0192]
            w_y: [0.0000, 0.0276, -0.0028, -0.0085]

      slope_up:
        # TODO(data_required): 以下为 1.0 m/s 平地 Trial1 占位，不是实机上坡参数。
        omega: 5.874750
