# ======================================================================
# 外骨骼 ros2_control 控制器配置 + 关节↔电机映射
# 修改此文件后无需重新编译, 重启 launch 即生效 (launch 直接读 src 路径)
#
# 用法:
#   ros2 launch exoskeleton_hardware exo_tune.launch.py
#   # 步态: ros2 topic pub /cpg/state_cmd std_msgs/msg/String "data: start" --once
#
# 本文件两个用途:
#   1) controller_manager 参数 (controller_manager/joint_state_broadcaster/
#      exo_impedance_controller 三段, 给 ros2_control 节点加载)
#   2) 硬件层关节↔电机映射 (末尾 joint_motor_map 段, 由硬件接口按
#      motor_map_file 直接用 yaml-cpp 读取, 不是节点参数, 勿删除)
# ======================================================================

controller_manager:
  ros__parameters:
    # 控制频率 [Hz]: 上位机每个周期向下位机(STM32)发送一次力矩指令
    # 500Hz = 每周期 2ms。STM32 每电机 1kHz 控制率, 500Hz 完全支持。
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    exo_impedance_controller:
      type: exoskeleton_controllers/ExoImpedanceController

# ---------------- joint_state_broadcaster 参数 ----------------
joint_state_broadcaster:
  ros__parameters:
    # 发布哪些关节的状态 (来自硬件接口, 即真实电机编码器)
    joints:
      - left_hip3
      - left_knee
      - right_hip3
      - right_knee
      - left_ankle
      - right_ankle

# ---------------- 阻抗控制器参数 ----------------
exo_impedance_controller:
  ros__parameters:
    # 控制的关节 (顺序对应 default_kp/kd/torque_limit 等数组, 下标一一对应)
    joints:
      - left_hip3    # 索引 0
      - left_knee    # 索引 1 ← motor2 (当前唯一接的真实电机)
      - right_hip3   # 索引 2
      - right_knee   # 索引 3

    # 虚拟管道壁控制：管内阻抗为0，管外按Kp/Kd产生边界恢复命令。
    # 刚度 Kp [iq/rad]: 越大误差越小, 过大则振荡 (实测 knee=120 会欠阻尼振荡)
    # 顺序: [left_hip3, left_knee, right_hip3, right_knee]
    default_kp: [60.0, 80.0, 20.0, 30.0]

    # 阻尼 Kd [iq*s/rad]: 抑制振荡; 越大越稳但跟踪变钝
    default_kd: [12.0, 16.0, 82.0, 98.0]

    # 虚拟管道半宽 [rad]：|q_ref-q| 在此范围内时，管道壁阻抗为零。
    # 默认0保持与旧阻抗律等价；可在调参GUI中按度实时修改和保存。
    default_tube_half_width: [0.0, 0.0, 0.0, 0.0]

    # 越过管道边界后的平滑激活宽度 [rad]：0=立即启用完整壁面阻抗。
    default_tube_transition_width: [0.0, 0.0, 0.0, 0.0]

    # 力矩上限 [iq]: 命令力矩限幅 (硬件电流上限 100, 电机典型 ±30)
    torque_limit: [80.0, 80.0, 80.0, 80.0]

    # 力矩变化率上限 [iq/s]: 限制力矩变化快慢, 防止冲击
    # 注意: 与 update_rate 无关 (按时间计算), 调大让力矩更快建立
    torque_rate_limit: [800.0, 800.0, 800.0, 800.0]

    # 速度低通滤波系数 (0~1, 1=不过滤): 越小滤波越重, 阻尼滞后越大
    velocity_filter_alpha: 1.0

    # 参考缩放 (0~1): 调试时降低跟踪幅值避免力矩饱和, 不改 CPG 参数
    # 例: 0.3 = 参考轨迹幅值缩到 30%, 方便验证控制器跟踪
    ref_scale: 1.0

    # 参考数据超时 [s]: 超过该时间未收到 CPG 参考 → 输出零力矩 (安全)
    data_timeout: 0.01

    # 调参GUI心跳超时 [s]。进入调参会话后，命令超时会让四关节输出平滑归零。
    tuning_command_timeout: 0.25

    # 透明度/助力叠加命令超时 [s]。当前不启用，无发布者时两项均为0。
    auxiliary_command_timeout: 0.1

# ---------------- 硬件层: 关节↔电机映射 + 方向符号 ----------------
# 由硬件接口按 URDF 的 motor_map_file 参数读取本段 (yaml-cpp 直接读文件)
# 注: 本段必须写成合法 ROS 参数形式 (每个顶层节点以 ros__parameters 开头),
#     否则 controller_manager 启动解析该文件会报错
# 修改后重启 launch 生效, 无需重新编译
#   joints    : 关节名 (顺序与 motor_id / joint_sign 一一对应)
#   motor_id  : 各关节对应的下位机电机编号 (1~4, 对应 2 CAN × 2)
#   joint_sign: 电机方向与 URDF 反向的关节设 -1, 正常为 1
#               逐个接电机验证方向后修改 (RVIZ 显示与控制方向一起纠正)
joint_motor_map:
  ros__parameters:
    joints: [left_hip3, left_knee, right_hip3, right_knee]
    motor_id: [1, 2, 3, 4]
    joint_sign: [1, -1, -1, 1]

# ---------------- 左右踝 BRT25 编码器映射 + 机械零偏 ----------------
# 顺序必须为 [left_ankle, right_ankle]，与 STM32 0x15 踝尾部一致。
# zero_offset_counts 是脚掌位于定义的机械零位时的原始计数（0..4095）。
# 更新后重启 launch 生效；上位机按单圈最短距离进行环绕修正。
# joint_sign 只修正踝角显示/数据方向，不会发送任何电机指令。
ankle_encoder_map:
  ros__parameters:
    joints: [left_ankle, right_ankle]
    node_id: [1, 2]
    joint_sign: [1, -1]
    # 尚未做机械零位实测；先用 calibrate_ankle_zero 获取后替换。
    zero_offset_counts: [2800, 2000]
