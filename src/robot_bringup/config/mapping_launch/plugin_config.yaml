# min_filter fills in minimum value around the invalid cell.
min_filter:                                   
  enable: True                                # weather to load this plugin
  fill_nan: False                             # Fill nans to invalid cells of elevation layer.
  is_height_layer: True                       # If this is a height layer (such as elevation) or not (such as traversability)
  layer_name: "min_filter"                    # The layer name.
  extra_params:                               # This params are passed to the plugin class on initialization.
    dilation_size: 1                         # The patch size to apply
    iteration_n: 30                           # The number of iterations
# Apply smoothing.
smooth_filter:
  enable: True
  fill_nan: False
  is_height_layer: True
  layer_name: "smooth"
  extra_params:
    input_layer_name: "min_filter"
# Apply inpainting using opencv
inpainting:
  enable: True
  fill_nan: False
  is_height_layer: True
  layer_name: "inpaint"
  extra_params:
    method: "telea"                           # telea or ns
# Apply smoothing for inpainted layer
erosion:
  enable: True
  fill_nan: False
  is_height_layer: False
  layer_name: "erosion"
  extra_params:
    input_layer_name: "traversability"
    dilation_size: 3
    iteration_n: 20
    reverse: True
# 1. 表面法向量计算插件 (生成 normal_x, normal_y, normal_z)
normal_filter:
  type: "elevation_mapping_cupy::NormalFilter"
  enable: true
  fill: "elevation"            # 基于哪个输入层计算法向
  radius: 0.1                  # 计算法向量的局部邻域半径 (米)，一般为网格分辨率的 2~3 倍
  layer_name: "normal"

  # 2. 地形可通行度计算插件 (生成 traversability)
traversability_filter:
  type: "elevation_mapping_cupy::TraversabilityFilter"
  enable: true
  fill: "elevation"
  critical_slope: 0.5          # 极限临界坡度 (弧度，约 30 度)
  critical_step: 0.15          # 极限跨越台阶高度 (米，如 15cm)
  layer_name: "traversability"