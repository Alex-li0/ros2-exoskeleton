# 高频传感器以 best-effort 订阅，避免 recorder 请求 reliable 时与传感器不兼容。
# tf_static 必须保留 transient-local，确保录包晚于 RSP 启动时仍能收到静态 TF。
/camera/imu:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 1000
/camera/gyro/sample:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 1000
/camera/accel/sample:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 1000
/camera/infra1/image_rect_raw:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 30
/camera/infra2/image_rect_raw:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 30
/camera/depth/image_rect_raw:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 30
/camera/depth/color/points:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 10
/tf_static:
  reliability: reliable
  durability: transient_local
  history: keep_all
