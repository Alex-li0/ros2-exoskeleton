# 实机数据集录制清单。required 用于录制前检查和录制后验收；
# optional 缺失不会判失败，但会降低对应派生算法的复现实用性。
required_topics:
  /camera/imu:
    type: sensor_msgs/msg/Imu
    min_rate_hz: 100.0
  /camera/infra1/image_rect_raw:
    type: sensor_msgs/msg/Image
    min_rate_hz: 20.0
  /camera/infra1/camera_info:
    type: sensor_msgs/msg/CameraInfo
    min_rate_hz: 20.0
  /camera/infra2/image_rect_raw:
    type: sensor_msgs/msg/Image
    min_rate_hz: 20.0
  /camera/infra2/camera_info:
    type: sensor_msgs/msg/CameraInfo
    min_rate_hz: 20.0
  /camera/depth/image_rect_raw:
    type: sensor_msgs/msg/Image
    min_rate_hz: 20.0
  /camera/depth/camera_info:
    type: sensor_msgs/msg/CameraInfo
    min_rate_hz: 20.0
  /camera/depth/color/points:
    type: sensor_msgs/msg/PointCloud2
    min_rate_hz: 5.0
  /joint_states:
    type: sensor_msgs/msg/JointState
    min_rate_hz: 50.0
  /dynamic_joint_states:
    type: control_msgs/msg/DynamicJointState
    min_rate_hz: 50.0
  /cpg/joint_ref:
    type: sensor_msgs/msg/JointState
    min_rate_hz: 100.0
  /cpg/state:
    type: std_msgs/msg/String
    min_rate_hz: 0.0
  /impedance/debug:
    type: sensor_msgs/msg/JointState
    min_rate_hz: 100.0
  /impedance/timing:
    type: std_msgs/msg/Float64MultiArray
    min_rate_hz: 100.0
  /tf:
    type: tf2_msgs/msg/TFMessage
    min_rate_hz: 1.0
  /tf_static:
    type: tf2_msgs/msg/TFMessage
    min_rate_hz: 0.0

# 录制前不只检查话题存在，还要确认踝编码器已真正进入消息。
# /joint_states 用于 RViz/通用关节算法；/dynamic_joint_states 保留原始计数和有效性。
required_joint_content:
  /joint_states:
    joints: [left_ankle, right_ankle]
  /dynamic_joint_states:
    joints: [left_ankle, right_ankle]
    interfaces: [position, velocity, raw_count, node_id, feedback_valid, stale]

optional_topics:
  # 原始 IMU 分流对重新同步、重新标定有用。
  /camera/gyro/sample: sensor_msgs/msg/Imu
  /camera/accel/sample: sensor_msgs/msg/Imu
  /camera/gyro/metadata: realsense2_camera_msgs/msg/Metadata
  /camera/accel/metadata: realsense2_camera_msgs/msg/Metadata
  /camera/infra1/metadata: realsense2_camera_msgs/msg/Metadata
  /camera/infra2/metadata: realsense2_camera_msgs/msg/Metadata
  /camera/depth/metadata: realsense2_camera_msgs/msg/Metadata
  # 若安装了独立盆腔 IMU，必须在相关实验中确认该话题存在。
  /imu/pelvis: sensor_msgs/msg/Imu
  # 在线算法输出用于和以后离线重跑结果对照，不替代上面的原始数据。
  /ov_msckf/odomimu: nav_msgs/msg/Odometry
  /ov_msckf/poseimu: geometry_msgs/msg/PoseWithCovarianceStamped
  /ov_msckf/trackhist: sensor_msgs/msg/Image
  /ov_msckf/points_msckf: sensor_msgs/msg/PointCloud2
  /elevation_mapping_node/elevation_map_raw: grid_map_msgs/msg/GridMap
  /elevation_mapping_node/elevation_map_filter: grid_map_msgs/msg/GridMap
  /plane_segmentation_node/planar_terrain: convex_plane_decomposition_msgs/msg/PlanarTerrain
  /plane_segmentation_node/segmentation_map: grid_map_msgs/msg/GridMap
  /plane_segmentation_node/diagnostics: diagnostic_msgs/msg/DiagnosticArray
  /fused/odometry: nav_msgs/msg/Odometry
  /fused/contact_state: std_msgs/msg/UInt8
  /fused/diagnostics: diagnostic_msgs/msg/DiagnosticArray
  /cpg/debug: terrain_adaptive_cpg/msg/CPGDebug
  /cpg/switch_debug: std_msgs/msg/Float64MultiArray
  /cpg/state_cmd: std_msgs/msg/String
  /cpg/gait_mode: std_msgs/msg/String
  /cpg/gait_mode_target: std_msgs/msg/String
  /position_controller/commands: std_msgs/msg/Float64MultiArray
  /experiment/event: std_msgs/msg/String
  /diagnostics: diagnostic_msgs/msg/DiagnosticArray
  /parameter_events: rcl_interfaces/msg/ParameterEvent
  /rosout: rcl_interfaces/msg/Log
  /robot_description: std_msgs/msg/String
