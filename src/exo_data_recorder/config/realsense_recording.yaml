/**:
  ros__parameters:
    device_type: 'd435i'
    serial_no: ''
    usb_port_id: ''
    initial_reset: true
    wait_for_device_timeout: 30.0

    enable_infra1: true
    enable_infra2: true
    enable_gyro: true
    enable_accel: true
    enable_depth: true
    enable_color: false

    global_time_enabled: true
    enable_sync: true
    unite_imu_method: 2
    hold_back_imu_for_frames: true
    gyro_fps: 400
    accel_fps: 250

    infra_width: 848
    infra_height: 480
    infra_fps: 30
    depth_width: 848
    depth_height: 480
    depth_fps: 30

    # 默认调试数据同时保留深度图和可直接供高程图使用的点云。
    pointcloud.enable: true
    pointcloud.stream_filter: 3
    pointcloud.stream_index_filter: 1
    pointcloud.allow_no_texture_points: true

    # 与现有实机配置保持一致，保留降采样、空间和时间滤波。
    filters: 'decimation,spatial,temporal'
    filter.decimation.filter_magnitude: 2
    filter.spatial.filter_magnitude: 2
    filter.spatial.filter_smooth_alpha: 0.5
    filter.spatial.filter_smooth_delta: 20
    filter.spatial.holes_fill: 0
    filter.temporal.filter_smooth_alpha: 0.4
    filter.temporal.filter_smooth_delta: 20

    # 当前关闭color并用infra1作为点云纹理，不生成无消费者的彩色对齐深度。
    align_depth.enable: false
    depth_module.emitter_enabled: 0
    clip_distance: 4.0
