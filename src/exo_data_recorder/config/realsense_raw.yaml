/**:
  ros__parameters:
    device_type: 'd435i'
    serial_no: ''
    usb_port_id: ''
    initial_reset: true
    wait_for_device_timeout: 30.0

    enable_infra1: true
    enable_infra2: true
    enable_gyro: true
    enable_accel: true
    enable_depth: true
    enable_color: false

    global_time_enabled: true
    enable_sync: true
    unite_imu_method: 2
    hold_back_imu_for_frames: true
    gyro_fps: 400
    accel_fps: 250

    infra_width: 848
    infra_height: 480
    infra_fps: 30
    depth_width: 848
    depth_height: 480
    depth_fps: 30

    # 无滤波对照组仍生成点云，便于和默认调试配置直接比较。
    align_depth.enable: false
    pointcloud.enable: true
    pointcloud.stream_filter: 3
    pointcloud.stream_index_filter: 1
    pointcloud.allow_no_texture_points: true
    filters: ''
    depth_module.emitter_enabled: 0
    clip_distance: -1.0
