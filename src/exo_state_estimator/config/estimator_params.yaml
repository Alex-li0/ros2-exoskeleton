ct_exo_state_node:
  ros__parameters:
    world_frame: "global"
    pelvis_frame: "pelvis_fused"
    imu_topic: "/imu/pelvis"
    joint_state_topic: "/joint_states"
    # Must be transformed to pelvis using the moving camera's kinematics first.
    # That converter is not implemented here. Do not rename raw odomimu's frame.
    vio_topic: "/pelvis/vio_odometry"
    vio_body_frame: "base_link"
    urdf_path: "/home/lsy/vins_ws/src/robot_display/urdf/robot_display.urdf"
    # Timer drains queues; graph keyframes follow new VIO measurement stamps.
    optimize_frequency: 200.0
    keyframe_frequency: 25.0  # Maximum graph update frequency; not a measured guarantee.
    lag_seconds: 5.0
    fusion_delay: 0.1         # Debug starting point; validate event decision latency.
    input_timeout: 0.5
    joint_max_gap: 0.03
    max_imu_gap: 0.02
    gait_state_timeout: 0.15
    gait_min_confidence: 0.8
    # Enable only after sole offsets and locked hip1/2 model zeros are calibrated.
    contact_geometry_calibrated: false
    left_contact_offset: [0.0, 0.0, 0.0]
    right_contact_offset: [0.0, 0.0, 0.0]
    use_terrain_factor: false
    map_timeout: 0.3
    prior_pos_sigma: 0.01
    prior_rot_sigma: 0.01
    # Empirical RELATIVE VIO noise. Not absolute pose covariance.
    vio_pos_sigma: 0.05
    vio_rot_sigma: 0.1
    kinematic_stick_sigma: 0.05
    use_imu_factor: true
    # B_T_I: sensor pose expressed in the pelvis frame; replace after calibration.
    body_imu_xyz: [0.0, 0.0, 0.0]
    body_imu_rpy: [0.0, 0.0, 0.0]
    imu_accel_noise: 0.01
    imu_gyro_noise: 0.001
    imu_accel_bias_rw: 0.0002
    imu_gyro_bias_rw: 0.00003
